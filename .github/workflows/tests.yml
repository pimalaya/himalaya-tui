name: Tests

on:
  push:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit
  features:
    # Each backend builds alone, so clippy runs over every feature set a
    # packager may pick, one cache for all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy over every feature set
        run: |
          set -e
          sets=(
            ""
            "--all-features"
            "--no-default-features --features rustls-ring"
            "--no-default-features --features native-tls,jmap"
            "--no-default-features --features rustls-ring,maildir,mbox,pimdir"
          )
          for backend in imap smtp jmap gmail msgraph maildir mbox pimdir; do
            sets+=("--no-default-features --features rustls-ring,$backend")
          done
          for set in "${sets[@]}"; do
            echo "::group::clippy $set"
            read -ra flags <<< "$set"
            nix develop -c cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
            echo "::endgroup::"
          done
      - name: Test a build with one backend
        run: nix develop -c cargo test --locked --no-default-features --features rustls-ring,maildir
