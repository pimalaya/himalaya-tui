[package]
name = "himalaya-tui"
description = "TUI to manage emails"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "email"]
keywords = ["tui", "email", "imap", "ratatui", "jmap"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/himalaya-tui"

[features]
default = ["rustls-ring", "imap", "smtp", "jmap", "gmail", "msgraph", "maildir", "mbox", "pimdir", "vendored"]
imap = ["himalaya/imap"]
smtp = ["himalaya/smtp"]
jmap = ["himalaya/jmap"]
gmail = ["himalaya/gmail"]
msgraph = ["himalaya/msgraph"]
maildir = ["himalaya/maildir"]
mbox = ["himalaya/mbox"]
pimdir = ["himalaya/pimdir"]
native-tls = ["himalaya/native-tls"]
rustls-aws = ["himalaya/rustls-aws"]
rustls-ring = ["himalaya/rustls-ring"]
vendored = ["himalaya/vendored"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.6.1", default-features = false, features = ["build"] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.4", features = ["derive", "wrap_help"] }
edtui = { version = "0.11", features = ["system-editor"] }
himalaya = { version = "2.2", default-features = false }
html2text = "0.17"
log = "0.4"
mime-meta-language = { version = "2", default-features = false, features = ["compiler", "interpreter"] }
mime-rs = { version = "0.2", default-features = false, features = ["base64", "encoding", "parser"] }
pimalaya-cli = { version = "0.6.1", default-features = false, features = ["spinner", "terminal"] }
pimalaya-config = { version = "0.6.0", default-features = false, features = ["toml", "secret"] }
ratatui = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-cpu = { version = "0.1", default-features = false, features = ["std"] }
simplelog = "0.12"
tempfile = "3"
toml = "1.1"
tui-input = { version = "0.15", default-features = false }

[patch.crates-io]
himalaya = { git = "https://github.com/pimalaya/himalaya", rev = "0cb2ff4d41da4f0d94786b0facab592365f14932" }
mime-meta-language = { git = "https://github.com/pimalaya/mml", rev = "1b9f3f21e4b9be3131f0a00f1159f9baa881b235" }
