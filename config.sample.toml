# ================================================================================
# himalaya-tui configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/himalaya/config.toml
#   - $HOME/.config/himalaya/config.toml
#   - $HOME/.himalayarc
#
# Override with `himalaya-tui -c <PATH>` or `HIMALAYA_CONFIG=<PATH>`. Multiple
# paths can be passed at once, separated by `:`; the first one is the base and
# the rest are deep-merged on top of it. `--no-config` skips on-disk config.
#
# A run that resolves no account falls back to the wizard, the himalaya CLI's
# own: it discovers an account from an email address, then offers to write the
# `[accounts.<name>]` block here. Ask for it with `himalaya-tui <EMAIL>` or
# `--no-config`; declining the offer opens the account for the session alone.
#
# One file backs both binaries, so TUI-only fields (`keybinds`, `theme`) and
# CLI-only sections (`table`, `envelope`, `message`, `attachment`, `account`)
# coexist. The identity is read under either spelling, `from`/`from-name` or
# `email`/`display-name`, and written under the CLI's.
# ================================================================================

# --------------------------------------------------------------------------------
# Global config
# --------------------------------------------------------------------------------

# Default From display name used by the in-app composer when an account does
# not override it.
#display-name = "Example"

# Default signature appended to outgoing drafts. The value is the signature
# alone: the separator introducing it is `signature-delim` below, so the same
# value reads the same under the himalaya CLI.
#signature = "Regards,\nExample"

# Signature delimiter inserted between the body and the signature. Defaults to
# the RFC 3676 `"-- \n"` separator, and is written verbatim, so a delimiter
# meant to stand on its own line carries its own trailing newline.
#signature-delim = "-- \n"

# Default download directory for attachments. Falls back to `$TMPDIR`.
#downloads-dir = "~/downloads"

# Composer keybinding flavor: `vim` (default) or `emacs`, overridden by the
# `--keybinds` flag. It drives edtui's own bindings and the event loop's
# intercepts, notably `Ctrl-e`, which collides with Emacs' end of line.
#keybinds = "vim"

# --------------------------------------------------------------------------------
# Theme
# --------------------------------------------------------------------------------
#
# Color theme for the TUI. By default the binary uses named ANSI colors so the
# rendering inherits the terminal palette. Pick a preset and/or override
# individual fields below.
#
# Color values accept anything ratatui understands:
#   - named ANSI: "black", "red", …, "white", "dark-gray", "light-red", …
#   - hex RGB:    "#ff8800"
#   - 256-color:  "33" (xterm-256 palette index)
#   - "reset":    terminal default
#
# `mod` is a list of modifiers among:
#   bold, dim, italic, underlined, slow-blink, rapid-blink, reversed, hidden,
#   crossed-out

#[theme]

# Preset theme: `default` (named ANSI), `dracula-dark`, `one-light` or
# `tokyo-night`. Omit to start from the built-in default; overrides below are
# layered on top.
#preset = "dracula-dark"

# Each `[theme.*]` table overrides one UI element. Any field left out keeps
# the value from the preset (or the built-in default). Examples below cover
# every themable element with its built-in default value.

# Top header bar (account name).
#[theme.header]
#bg = "blue"
#fg = "white"
#mod = ["bold"]

# Bottom status bar.
#[theme.status-bar]
#bg = "dark-gray"
#fg = "white"

# Border of the currently-focused panel.
#[theme.border-active]
#fg = "cyan"

# Border of inactive panels.
#[theme.border-inactive]
#fg = "gray"

# Border of modal dialogs (Actions, Copy/Move To, Add/Remove Flag, …).
#[theme.dialog-border]
#fg = "yellow"

# Selected row / dialog item ("cursor").
#[theme.cursor]
#bg = "cyan"
#fg = "white"
#mod = ["bold"]

# Marker on the currently-open mailbox in the mailbox list.
#[theme.mailbox-current]
#fg = "yellow"
#mod = ["bold"]

# Envelope table column header row.
#[theme.envelope-header]
#fg = "yellow"
#mod = ["bold"]

# Envelopes flagged as Seen (read messages).
#[theme.envelope-seen]
#fg = "gray"

# Envelopes without the Seen flag (unread messages).
#[theme.envelope-unread]
#mod = ["bold"]

# Message reader body text.
#[theme.message-body]
#fg = "white"

# Composer body text.
#[theme.compose-text]
#fg = "white"

# Composer cursor cell.
#[theme.compose-cursor]
#bg = "white"
#fg = "black"

# Composer visual-mode selection.
#[theme.compose-selection]
#bg = "cyan"
#fg = "black"

# --------------------------------------------------------------------------------
# Account config
# --------------------------------------------------------------------------------

# Declare one section per account. Pick one with `himalaya-tui -a <NAME>`, or
# let the entry flagged `default = true` be used. The positional argument is
# not an account name: it answers the wizard's first prompt instead.
[accounts.example]

# Use this account when `-a` is not passed.
default = true

# From address used when sending, overridden by the `--from <EMAIL>` flag.
# Also spelled `email`, the key the himalaya CLI writes: both binaries read
# both spellings, one file backing the two.
#from = "user@example.com"

# From display name, overridden by the `--from-name <NAME>` flag. Also spelled
# `display-name`, the key the himalaya CLI writes.
#from-name = "Example User"

# Per-account overrides for the global options above.
#signature = "Best,\nExample User"
#signature-delim = "-- \n"
#downloads-dir = "~/downloads/example"

# Mailbox aliases mapping a friendly name to a backend-native id, written by
# the wizard from what the server reported. Read by the himalaya CLI, which
# addresses a mailbox by id, and inert here: a name is resolved against the
# live listing before every dispatch.
#mailbox.alias.inbox = "INBOX"
#mailbox.alias.drafts = "Drafts"

# --------------------------------------------------------------------------------
# IMAP config
# https://www.iana.org/go/rfc9051
# --------------------------------------------------------------------------------

# IMAP server, a bare authority (`host[:port]`) meaning `imaps://`. A full URL
# takes `imap://` (cleartext, optionally upgraded via STARTTLS), `imaps://`
# (implicit TLS) or `unix://` (a pre-authenticated local socket proxy such as
# sirup, over which no SASL is negotiated). Any other scheme is rejected.
imap.server = "example.com"
#imap.server = "imap.example.com:143"
#imap.server = "imap://example.com:143"
#imap.server = "imaps://example.com:993"
#imap.server = "unix:///run/user/1000/sirup/imap.sock"

# TLS provider, defaults to the first available at runtime.
#imap.tls.provider = "rustls"
#imap.tls.provider = "native-tls"

# Crypto provider for rustls, defaults to the first available at runtime.
#imap.tls.rustls.crypto = "ring"
#imap.tls.rustls.crypto = "aws"

# Custom TLS certificate (extra root, PEM-encoded).
#imap.tls.cert = "/path/to/custom/cert.pem"

# Enable STARTTLS (only valid when the server resolves to `imap://`).
#imap.starttls = false

# ALPN identifiers offered during the TLS handshake, read by rustls alone.
# Unset applies io-imap's own default (["imap"]), and [] skips the negotiation.
#imap.alpn = ["imap"]
#imap.alpn = []

# Pick exactly one SASL mechanism among `anonymous`, `login`, `plain`,
# `oauthbearer`, `xoauth2`, `scram-sha-256`. Omit the whole `imap.sasl` table
# to skip authentication entirely (no `AUTHENTICATE` command sent).

# SASL ANONYMOUS
# https://datatracker.ietf.org/doc/html/rfc4505
#imap.sasl.anonymous.message = "himalaya"

# SASL PLAIN
# https://datatracker.ietf.org/doc/html/rfc4616
imap.sasl.plain.username = "user@example.com"
imap.sasl.plain.password.raw = "***"
#imap.sasl.plain.password.command = "pass show example"

# SASL LOGIN
# https://datatracker.ietf.org/doc/html/draft-murchison-sasl-login-00
#imap.sasl.login.username = "user@example.com"
#imap.sasl.login.password.raw = "***"

# SASL OAUTHBEARER (host/port for the GS2 header are derived from the
# IMAP server URL at connect time).
# https://datatracker.ietf.org/doc/html/rfc7628
#imap.sasl.oauthbearer.username = "user@example.com"
#imap.sasl.oauthbearer.token.raw = "***"
#imap.sasl.oauthbearer.token.command = ["ortie", "token", "show", "-a", "example"]

# SASL XOAUTH2 (Google's pre-standard OAuth 2.0 SASL).
# https://developers.google.com/gmail/imap/xoauth2-protocol
#imap.sasl.xoauth2.username = "user@example.com"
#imap.sasl.xoauth2.token.raw = "***"

# SASL SCRAM-SHA-256.
# https://datatracker.ietf.org/doc/html/rfc7677
#imap.sasl.scram-sha-256.username = "user@example.com"
#imap.sasl.scram-sha-256.password.raw = "***"

# RFC 4959 SASL-IR, following the advertised capability when unset. `false`
# waits for the server's continuation request instead of sending credentials
# inline, which is what Coremail (126.com, 163.com) needs; `true` always
# inlines them.
# https://www.rfc-editor.org/rfc/rfc4959.html
#imap.sasl-ir = false

# RFC 2971 ID extension. Some providers (mail.qq.com, fastmail) require an `ID`
# exchange straight after authentication; set `auto = true` to opt in.
# https://www.rfc-editor.org/rfc/rfc2971.html
#imap.id.auto = false

# Per-field policy for the auto-ID command, an empty map sending `ID NIL`.
# `true` substitutes the canned value for a well-known key (name, version,
# vendor, support-url) and NIL for any other, `false` always sends NIL. A key
# absent from this map is not sent at all.
#imap.id.fields = { name = true, version = true, vendor = true, support-url = true }

# RFC 5256 SORT fallback, read by the himalaya CLI alone. The TUI paginates a
# sequence-set window rather than issuing `SORT`, so it accepts the option to
# keep a shared file loading, then ignores it.
# https://www.rfc-editor.org/rfc/rfc5256.html
#imap.sort.fallback = false

# --------------------------------------------------------------------------------
# JMAP config
# https://www.iana.org/go/rfc8620
# https://www.iana.org/go/rfc8621
# --------------------------------------------------------------------------------

# JMAP server address. Either a bare authority (auto-discovered via
# `GET /.well-known/jmap`) or a full session URL.
#jmap.server = "fastmail.com"
#jmap.server = "https://api.fastmail.com/jmap/session"

# JMAP TLS provider (mirrors the imap.tls block above).
#jmap.tls.provider = "rustls"
#jmap.tls.rustls.crypto = "ring"
#jmap.tls.cert = "/path/to/custom/cert.pem"

# ALPN identifiers offered during the TLS handshake. Unset applies io-jmap's
# own default (["http/1.1"], JMAP riding on HTTP/1.1), and [] skips the
# negotiation.
#jmap.alpn = ["http/1.1"]
#jmap.alpn = []

# Pick exactly one of `header`, `bearer`, `basic`.

# Raw `Authorization` header value, used verbatim.
#jmap.auth.header.raw = "Bearer eyJhbGciOiJ…"
#jmap.auth.header.command = "pass show fastmail-token"

# OAuth 2.0 / API token bearer.
#jmap.auth.bearer.token.raw = "***"
#jmap.auth.bearer.token.command = ["ortie", "token", "show", "-a", "fastmail"]

# HTTP Basic.
#jmap.auth.basic.username = "user@example.com"
#jmap.auth.basic.password.raw = "***"
#jmap.auth.basic.password.command = "pass show fastmail"

# Identity to send as, the first one `Identity/get` reports when omitted. Set
# it to pin a specific one, listing them with `himalaya jmap identity get`.
#jmap.identity-id = "I0123abc"

# Drafts mailbox id used to stage outgoing messages before submission. Omitted,
# the mailbox with the `drafts` role is resolved from the live session. Find it
# with `himalaya jmap mailbox query --role drafts`.
#jmap.drafts-mailbox-id = "M0123abc"

# --------------------------------------------------------------------------------
# Maildir config
# --------------------------------------------------------------------------------

# Root directory containing one subdirectory per mailbox (Maildir++ layout).
#maildir.root = "~/Mail/example"

# --------------------------------------------------------------------------------
# SMTP config
# https://www.iana.org/go/rfc5321
# --------------------------------------------------------------------------------

# SMTP server, a bare authority (`host[:port]`) meaning `smtps://`. A full URL
# takes `smtp://` (cleartext, optionally upgraded via STARTTLS), `smtps://`
# (implicit TLS) or `unix://` (a pre-authenticated local socket proxy such as
# sirup, over which no SASL is negotiated). Any other scheme is rejected.
#
# A storage backend that cannot send on its own (IMAP, Maildir) routes the
# composer through this block, JMAP sending on its own and ignoring it. The
# connection opens on the first send, not at startup.
smtp.server = "example.com"
#smtp.server = "smtp.example.com:587"
#smtp.server = "smtp://example.com:587"
#smtp.server = "smtps://example.com:465"
#smtp.server = "unix:///run/user/1000/sirup/smtp.sock"

# TLS provider, defaults to the first available at runtime.
#smtp.tls.provider = "rustls"
#smtp.tls.provider = "native-tls"

# Crypto provider for rustls, defaults to the first available at runtime.
#smtp.tls.rustls.crypto = "ring"
#smtp.tls.rustls.crypto = "aws"

# Custom TLS certificate (extra root, PEM-encoded).
#smtp.tls.cert = "/path/to/custom/cert.pem"

# Enable STARTTLS (only valid when the server resolves to `smtp://`).
#smtp.starttls = false

# ALPN identifiers offered during the TLS handshake, read by rustls alone.
# Unset applies io-smtp's own default (["smtp"]), and [] skips the negotiation.
#smtp.alpn = ["smtp"]
#smtp.alpn = []

# Pick exactly one SASL mechanism among `anonymous`, `login`, `plain`,
# `oauthbearer`, `xoauth2`, `scram-sha-256`. Omit the whole `smtp.sasl` table
# to skip authentication entirely.

# SASL ANONYMOUS
#smtp.sasl.anonymous.message = "himalaya"

# SASL PLAIN
smtp.sasl.plain.username = "user@example.com"
smtp.sasl.plain.password.raw = "***"
#smtp.sasl.plain.password.command = "pass show example"

# SASL LOGIN
#smtp.sasl.login.username = "user@example.com"
#smtp.sasl.login.password.raw = "***"

# SASL OAUTHBEARER (host/port for the GS2 header are derived from the
# SMTP server URL at connect time).
#smtp.sasl.oauthbearer.username = "user@example.com"
#smtp.sasl.oauthbearer.token.raw = "***"

# SASL XOAUTH2
#smtp.sasl.xoauth2.username = "user@example.com"
#smtp.sasl.xoauth2.token.raw = "***"

# SASL SCRAM-SHA-256
#smtp.sasl.scram-sha-256.username = "user@example.com"
#smtp.sasl.scram-sha-256.password.raw = "***"
