# ================================================================================
# himalaya-tui configuration file.
#
# The TUI reads the himalaya CLI's own configuration, from the first valid path
# among:
#   - $XDG_CONFIG_HOME/himalaya/config.toml
#   - $HOME/.config/himalaya/config.toml
#   - $HOME/.himalayarc
#
# Override with `himalaya-tui -c <PATH>`, repeated to merge several files: the
# first one is the base and the next ones are deep-merged on top of it.
#
# The TUI runs himalaya's own commands, so everything about an account (its
# backends, credentials, mailbox aliases, sent copy) is himalaya's and is
# documented in himalaya's sample:
#   https://github.com/pimalaya/himalaya/blob/master/config.sample.toml
#
# This file documents what the TUI adds on top: the composer's keybindings, the
# contact command and the theme. They live under a `[tui]` table, at the top
# level and in an account (`[accounts.<name>.tui]`), which himalaya leaves to
# the TUI, so one file backs both binaries. Written outside those tables, they
# are not read by the TUI and himalaya refuses the file, as any key it does not
# know.
# ================================================================================

# --------------------------------------------------------------------------------
# Global config
# --------------------------------------------------------------------------------

# From display name and signature, himalaya's keys, which the TUI's composer
# reads too. The signature is the signature alone: `signature-delim` introduces
# it, defaulting to the RFC 3676 `"-- \n"`, written verbatim.
#display-name = "Example"
#signature = "Regards,\nExample"
#signature-delim = "-- \n"

# --------------------------------------------------------------------------------
# TUI config
# --------------------------------------------------------------------------------

#[tui]

# Composer keybinding flavor: `vim` (default) or `emacs`, overridden by the
# `--keybinds` flag. It drives edtui's own bindings and the event loop's
# intercepts, notably `Ctrl-e`, which collides with Emacs' end of line.
#keybinds = "vim"

# Command answering the contacts matching a recipient fragment, one per line as
# `address<TAB>name` (aerc format). `%s` is replaced by the shell-quoted
# fragment, and without it the fragment is appended. Exit 1 with no output
# means no match. Overridable per account.
#contact-command = "khard email --parsable --remove-first-line %s"

# Key completing the recipient under the cursor in a To, Cc, Bcc or Reply-To
# header, elsewhere reaching the editor as usual. Modifiers: `ctrl-`, `alt-`,
# `shift-`.
#contact-complete-key = "tab"

# --------------------------------------------------------------------------------
# Theme
# --------------------------------------------------------------------------------
#
# Color theme for the TUI. By default the binary uses named ANSI colors so the
# rendering inherits the terminal palette. Pick a preset and/or override
# individual fields below.
#
# Color values accept anything ratatui understands:
#   - named ANSI: "black", "red", …, "white", "dark-gray", "light-red", …
#   - hex RGB:    "#ff8800"
#   - 256-color:  "33" (xterm-256 palette index)
#   - "reset":    terminal default
#
# `mod` is a list of modifiers among:
#   bold, dim, italic, underlined, slow-blink, rapid-blink, reversed, hidden,
#   crossed-out

#[tui.theme]

# Preset theme: `default` (named ANSI), `dracula-dark`, `one-light` or
# `tokyo-night`. Omit to start from the built-in default; overrides below are
# layered on top.
#preset = "dracula-dark"

# Each `[tui.theme.*]` table overrides one UI element. Any field left out keeps
# the value from the preset (or the built-in default). Examples below cover
# every themable element with its built-in default value.

# Top header bar (account name).
#[tui.theme.header]
#bg = "blue"
#fg = "white"
#mod = ["bold"]

# Bottom status bar.
#[tui.theme.status-bar]
#bg = "dark-gray"
#fg = "white"

# Border of the currently-focused panel.
#[tui.theme.border-active]
#fg = "cyan"

# Border of inactive panels.
#[tui.theme.border-inactive]
#fg = "gray"

# Border of modal dialogs (Actions, Copy/Move To, Add/Remove Flag, …).
#[tui.theme.dialog-border]
#fg = "yellow"

# Selected row / dialog item ("cursor").
#[tui.theme.cursor]
#bg = "cyan"
#fg = "white"
#mod = ["bold"]

# Marker on the currently-open mailbox in the mailbox list.
#[tui.theme.mailbox-current]
#fg = "yellow"
#mod = ["bold"]

# Envelope table column header row.
#[tui.theme.envelope-header]
#fg = "yellow"
#mod = ["bold"]

# Envelopes flagged as Seen (read messages).
#[tui.theme.envelope-seen]
#fg = "gray"

# Envelopes without the Seen flag (unread messages).
#[tui.theme.envelope-unread]
#mod = ["bold"]

# Envelope row marked for an action, patched over its seen or unread style.
#[tui.theme.envelope-marked]
#fg = "magenta"
#mod = ["bold"]

# Message reader body text.
#[tui.theme.message-body]
#fg = "white"

# Composer body text.
#[tui.theme.compose-text]
#fg = "white"

# Composer cursor cell.
#[tui.theme.compose-cursor]
#bg = "white"
#fg = "black"

# Composer visual-mode selection.
#[tui.theme.compose-selection]
#bg = "cyan"
#fg = "black"

# --------------------------------------------------------------------------------
# Account config
# --------------------------------------------------------------------------------

# One section per account, as himalaya's sample documents it. Pick one with
# `himalaya-tui -a <NAME>`, or let the entry flagged `default = true` be used.
[accounts.example]
default = true

# The identity the composer writes from, overridden by `--from` and
# `--from-name`. `from` and `from-name` are read as aliases.
#email = "user@example.com"
#display-name = "Example User"

# Per-account overrides of the global options above.
#signature = "Best,\nExample User"
#tui.contact-command = ["abook", "--mutt-query", "%s"]

# The backend blocks (`imap`, `smtp`, `jmap`, `gmail`, `msgraph`, `maildir`,
# `mbox`, `pimdir`) are himalaya's: see its sample for every option.
#maildir.root = "~/Mail"
