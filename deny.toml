[advisories]
# Both advisories are "unmaintained", not vulnerabilities. Both crates are
# pulled transitively via edtui -> syntect; there is no safe upgrade until
# syntect migrates to maintained forks (yaml-rust2, bincode 2.x).
ignore = [
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained, transitive via syntect; no upstream fix yet" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained, transitive via syntect; no upstream fix yet" },

  # chrono is unmaintained, not vulnerable, with no maintained release to
  # move to. imap-types exposes it in its API (duesee/imap-codec#752), and
  # the family moves its own code to jiff.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, see duesee/imap-codec#752" },
]

[sources]
allow-org.github = ["pimalaya"]
unknown-git = "deny"
unknown-registry = "deny"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
